<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập | F8</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.2/css/all.css"
    />
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="../index.html">
        <img src="../assets/favicon.png" alt="F8" class="logo" />
      </a>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="search"
          placeholder="Tìm khóa học, bài viết, hỏi đáp..."
          aria-label="Tìm kiếm"
        />
      </div>

      <span class="header-actions">
        <a href="#" class="my-courses-link">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>Khóa học của tôi</span>
        </a>
        <a href="#" class="notification" aria-label="Thông báo">
          <i class="fa-solid fa-bell"></i>
          <span class="notification-badge">3</span>
        </a>
        <a href="#" class="avatar">
          <img src="../assets/avatar.png" alt="Hương Trà" />
        </a>
      </span>
    </header>

    <main class="page">
      <div class="page-head">
        <h1 class="page-title">Bài tập</h1>
        <p class="page-desc">
          Luyện tập sau mỗi bài học để ghi nhớ kiến thức lâu hơn và tự tin đi
          làm.
        </p>

        <div class="page-tabs">
          <a class="page-tab page-tab-active" href="#">Tất cả</a>
          <a class="page-tab" href="#">Chưa làm</a>
          <a class="page-tab" href="#">Đã nộp</a>
          <a class="page-tab" href="#">Đã chấm</a>
        </div>
      </div>

      <div class="loading-box" aria-label="Đang tải bài tập">
        <span class="spinner"></span>
        <p class="loading-text">Đang tải bài tập...</p>
      </div>
    </main>
  </body>
</html>
